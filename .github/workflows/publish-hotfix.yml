name: Publish Hot Fix

on:
  workflow_dispatch:

concurrency:
  group: $${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    name: CDP-build-hotfix-workflow
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Depth 0 required for branch-based versioning
      - name: Publish Hot Fix
        uses: DEFRA/cdp-build-action/build-hotfix@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: read
    uses: ./.github/workflows/sonarcloud.yml
    needs: build
    with:
      runner: ${{ vars.RUNNER || 'ubuntu-latest' }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
